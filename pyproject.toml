[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-task-harness"
version = "0.1.0"
description = "Sequential fresh-session task harness for Codex CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suh DongHyun" }]
dependencies = []

[project.scripts]
harness = "codex_harness.cli:entrypoint"

[tool.setuptools.package-data]
codex_harness = ["schemas/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"scripts/harness.py" = ["E402", "I001"]
